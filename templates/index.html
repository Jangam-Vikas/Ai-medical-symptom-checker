<!DOCTYPE html>
<html>

<head>

    <title>AI Medical Symptom Checker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>🩺 AI Medical Symptom Checker</h1>

<form action="/analyze" method="POST">

<label>Full Name</label>
<input type="text" name="name" required>

<label>Age</label>
<input type="number" name="age" required>

<label>Gender</label>

<select name="gender">

<option>Male</option>
<option>Female</option>
<option>Other</option>

</select>

<label>Height (cm)</label>
<input type="number" name="height">

<label>Weight (kg)</label>
<input type="number" name="weight">

<label>Symptoms</label>

<textarea
name="symptoms"
placeholder="Example: Fever, Cough, Headache"
required></textarea>

<label>Duration</label>

<input
type="text"
name="duration"
placeholder="Example: 3 Days">

<label>Temperature (°C)</label>

<input
type="number"
step="0.1"
name="temperature">

<button type="submit">

Analyze

</button>

</form>

</div>

</body>

</html>
